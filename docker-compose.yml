services:
  mysql:
    image: mysql:8.4
    container_name: foodhub-db
    environment:
      MYSQL_DATABASE: foodhub
      MYSQL_USER: foodhub
      MYSQL_PASSWORD: foodhub
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
    mysql_data: