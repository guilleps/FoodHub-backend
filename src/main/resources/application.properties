server.port=8080

# DATABASE CONFIGURATION
spring.jpa.hibernate.ddl-auto=create-drop
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_MYSQL_USERNAME}
spring.datasource.password=${DB_MYSQL_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=30000

# AUTH CONFIGURATION
# https://tools.keycdn.com/sha256-online-generator
security.jwt.key.private=${JWT_KEY_PRIVATE}
security.jwt.user.generator=${JWT_USER}
security.jwt.expiration=1800000

# EMAIL SERVICE CONFIGURATION
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

frontUrl=${FRONT_URL}

google.drive.folder.id=DRIVE_FOLDER_ID
google.credentials.path.storage=./credentials.json